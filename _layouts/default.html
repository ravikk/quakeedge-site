<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }} — Earthquake detection project{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="{{ '/' | relative_url }}"><svg viewBox="0 0 34 18" aria-hidden="true"><path d="M0 9h8l3-6 4 12 4-14 3 10 2-2h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="color:var(--accent)"/></svg>{{ site.title }}</a>
    <nav>
      {% for item in site.data.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>

<main>
  <article class="wrap content">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    {{ content }}
  </article>
</main>

<footer>
  <div class="inner">
    <span>© {{ site.time | date: "%Y" }} {{ site.author }} · {{ site.title }}</span>
    <span>Updated {{ site.time | date: "%-d %b %Y" }}</span>
  </div>
</footer>
</body>
</html>
